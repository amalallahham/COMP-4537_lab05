<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hospital DB Console</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Tektur:wght@400..900&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-hospital">


  <main class="container my-4">
    <section class="row g-4">
      <div class="col-12">
        <div class="p-4 rounded-4 hero-card">
          <h1 id="txtTitle" class="display-6 mb-2"></h1>
          <p id="txtSubtitle" class="lead mb-0"></p>
        </div>
      </div>
    </section>

    <section class="row g-4 mt-1">
      <div class="col-lg-6">
        <div class="card card-light-blue rounded-4 ">
          <div class=" border-0 p-3">
            <h2 id="txtPanelQueryTitle" class="h5 mb-2"></h2>
            <p id="txtPanelQueryDesc" class="text-secondary small mb-0"></p>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="sqlInput" id="txtSqlLabel" class="form-label"></label>
              <textarea id="sqlInput" rows="6" class="form-control font-mono" placeholder="SELECT * FROM patient;"></textarea>
              <div id="sqlHelp" class="form-text"></div>
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <button id="btnRun" class="btn btn-primary px-4">
                <span class="me-1">▶</span><span id="txtBtnRun"></span>
              </button>
              <button id="btnSeed" class="btn btn-outline-primary px-4">
                <span class="me-1">➕</span><span id="txtBtnSeed"></span>
              </button>
              <div class="form-check ms-auto">
                <input class="form-check-input" type="checkbox" value="" id="chkAutoRefresh" checked>
                <label class="form-check-label" for="chkAutoRefresh" id="txtAutoRefreshLabel"></label>
              </div>
            </div>

            <div id="alertArea" class="mt-3"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm rounded-4 border-0">
          <div class="card-header bg-white border-0 pt-3 pb-0">
            <h2 id="txtPanelResponseTitle" class="h5 mb-2"></h2>
            <p id="txtPanelResponseDesc" class="text-secondary small mb-0"></p>
          </div>
          <div class="card-body">
            <pre id="rawResponse" class="bg-light rounded-3 p-3 border small overflow-auto" style="max-height: 280px;"></pre>
          </div>
        </div>
      </div>
    </section>

    <section class="row g-4 mt-1">
      <div class="col-12">
        <div class="card card-light-blue rounded-4">
          <div class="border-0 p-3 pb-0 d-flex align-items-center">
            <div>
              <h2 id="txtTableTitle" class="h5 mb-2"></h2>
              <p id="txtTableDesc" class="text-secondary small mb-0"></p>
            </div>
            <div class="ms-auto">
              <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">
                <span class="me-1">⟳</span><span id="txtBtnRefresh"></span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive rounded-3 border">
              <table class="table align-middle mb-0">
                <thead class="table-hospital">
                  <tr>
                    <th>patientid</th>
                    <th>name</th>
                    <th>dateOfBirth</th>
                  </tr>
                </thead>
                <tbody id="patientTbody">
                </tbody>
              </table>
            </div>
            <div class="text-end mt-2">
              <small class="text-secondary" id="txtRowCount"></small>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>



  <script src="./js/strings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
